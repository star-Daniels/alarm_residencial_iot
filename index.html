<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarme ESP32</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Alarme</h1>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">Conectando…</span></div>
  </header>

  <section class="panel arm">
    <div>
      <h2>Sistema</h2>
      <div class="state disarmed" id="armState">—</div>
    </div>
    <label class="switch" aria-label="Armar ou desarmar o sistema">
      <input type="checkbox" id="armToggle" disabled>
      <span class="track"></span>
      <span class="knob"></span>
    </label>
  </section>

  <section class="panel motion" id="motionBox" aria-live="polite">
    <div class="radar">
      <svg viewBox="0 0 24 24"><path d="M2 12a10 10 0 0 1 20 0"/><path d="M6 12a6 6 0 0 1 12 0"/><circle cx="12" cy="12" r="1.5"/><path d="M12 14v6"/></svg>
    </div>
    <h3 id="motionTitle">Sem movimento</h3>
    <p id="motionSub">Nenhuma movimentação registrada.</p>
    <button class="clear" id="clearBtn" disabled>Limpar alerta</button>
  </section>

  <section class="panel log">
    <h2>Eventos desta sessão</h2>
    <ul id="logList"><li class="empty">Nada por aqui ainda.</li></ul>
  </section>

  <a class="telegram" href="https://t.me/+YbvD51xPnXoyYzQx" target="_blank" rel="noopener">Entrar no grupo do Telegram</a>
</main>

<script type="module" src="conection.js"></script>
</body>
</html>
